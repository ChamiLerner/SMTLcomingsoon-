<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101413">
<meta name="description" content="נפלאות הדולומיטים · יורוטריפ 2026 — לוח זמנים יומי, המלצות אוכל, תצפיות, מזג אוויר, שוברים.">
<title>נפלאות הדולומיטים · 2026</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dolomites 26">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <strong>נפלאות הדולומיטים</strong>
    <small>15–22 ביולי 2026</small>
  </div>
  <button id="installBtn" class="install-btn" hidden>הוספה למסך הבית</button>
</header>

<main>
  <section id="today" class="view active"></section>

  <section id="days" class="view">
    <div class="page-title"><span class="eyebrow">כל המסלול · 8 ימים</span><h1>הטיול שלנו</h1></div>
    <div id="daysList" class="days-list"></div>
  </section>

  <section id="vouchers" class="view">
    <div class="page-title"><span class="eyebrow">פתיחה בלחיצה</span><h1>שוברים</h1></div>
    <div id="voucherList"></div>
  </section>

  <section id="info" class="view">
    <div class="page-title"><span class="eyebrow">כל מה שצריך</span><h1>מידע</h1></div>
    <div id="infoContent"></div>
  </section>
</main>

<nav class="tabbar">
  <button data-view="today" class="active"><span class="ic">☀︎</span><span class="lb">היום</span></button>
  <button data-view="days"><span class="ic">❖</span><span class="lb">הימים</span></button>
  <button data-view="vouchers"><span class="ic">🎟</span><span class="lb">שוברים</span></button>
  <button data-view="info"><span class="ic">ⓘ</span><span class="lb">מידע</span></button>
</nav>

<script src="trip-data.js"></script>
<script src="app.js"></script>
</body>
</html>
